services:
  db:
    image: mysql:8.0
    container_name: db          # nom FIXE -> doit matcher l'inventaire (comme en tf-way)
    networks: [wpnet]
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
  wordpress:
    image: wordpress:latest
    container_name: wp          # sinon compose nomme "<projet>-wordpress-1"
    depends_on: [db]
    ports: ["8080:80"]
    networks: [wpnet]
networks:
  wpnet: {}
