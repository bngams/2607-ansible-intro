# Voie ANSIBLE du projet APP (equivalent de app/tf).
# Monte la stack applicative ET publie l'inventaire des backends pour le projet INFRA.
- name: DEV - monter la stack applicative et publier l'inventaire des backends
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Demarrer la stack (reseau wpnet + db + wp)
      community.docker.docker_compose_v2:
        project_src: .
        state: present

    - name: Publier l'inventaire des BACKENDS (handoff dev -> ops)
      ansible.builtin.copy:
        dest: inventory-backends.ini
        mode: "0644"
        content: |
          [wordpress]
          wp ansible_connection=community.docker.docker

          [db]
          db ansible_connection=community.docker.docker
