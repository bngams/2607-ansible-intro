---
# 6 — reverse proxy HAProxy devant WordPress. Cible : conteneur "proxy" sur wpnet.
- name: Reverse proxy devant WordPress
  hosts: proxy
  # Cible = conteneur debian:12 minimal : PAS de python (cf. chapitre 1) et PAS de sudo.
  # -> on desactive les facts le temps d'amorcer python, et on reste root (pas de become).
  gather_facts: false
  roles:
    - bootstrap_python
    - haproxy
