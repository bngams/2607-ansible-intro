# Voie ANSIBLE du provisioning INFRA (equivalent de infra/tf).
# 1) deploie le conteneur "proxy"
# 2) CONSTRUIT l'inventaire = backends recuperes de dev + notre hote proxy
#
# Difference avec app/ : ici on ne PUBLIE pas un inventaire, on le CONSOMME
# (handoff dev -> ops) et on y ajoute la machine qu'on administre.
- name: OPS - provisionner le reverse proxy et construire l'inventaire
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Le projet app/ publie son inventaire depuis tf/ OU ansible/, selon la voie
    # choisie a l'etape 1. On accepte les deux (premier trouve = gagnant).
    backends_candidates:
      - ../../app/tf/inventory-backends.ini
      - ../../app/ansible/inventory-backends.ini
  tasks:
    - name: Demarrer le conteneur proxy (sur le reseau wpnet de dev)
      community.docker.docker_compose_v2:
        project_src: .
        state: present

    - name: Localiser l'inventaire publie par dev (tf/ ou ansible/)
      ansible.builtin.set_fact:
        backends_src: "{{ backends_candidates | select('exists') | first | default('') }}"

    - name: Verifier que dev a bien publie son inventaire
      ansible.builtin.assert:
        that: backends_src | length > 0
        fail_msg: >-
          Aucun inventory-backends.ini trouve. Lancez d'abord l'etape 1 dans
          app/tf (terraform apply) OU app/ansible (ansible-playbook up.yml).

    - name: Recuperer les backends publies par dev (handoff)
      ansible.builtin.slurp:
        src: "{{ backends_src }}"
      register: backends

    - name: Construire l'inventaire ops = backends de dev + notre proxy
      ansible.builtin.copy:
        dest: inventory.ini
        mode: "0644"
        content: |
          # Genere par up.yml : backends (dev) + l'hote proxy (ops).
          {{ backends.content | b64decode }}
          [proxy]
          proxy ansible_connection=community.docker.docker
