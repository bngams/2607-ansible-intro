# Semaphore UI = alternative LEGERE a AWX/Tower, reellement lancable en compose.
# (AWX officiel n'est plus supporte hors Kubernetes -> voir le chapitre 7 pour AWX.)
# Valide sur : Docker 28 / Compose v2, image semaphoreui/semaphore v2.18.28.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semaphore_pw}
      POSTGRES_DB: semaphore
    volumes:
      - semaphore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore"]
      interval: 5s
      timeout: 3s
      retries: 10

  semaphore:
    image: semaphoreui/semaphore:v2.18.28   # version epinglee (pas de :latest)
    ports:
      - "127.0.0.1:3000:3000"               # UI liee au loopback (dev)
    volumes:
      # Le "repo Git surveille". En vrai ce serait une URL GitLab/GitHub ;
      # ici on monte un depot LOCAL pour que la demo tourne sans reseau.
      - ./demo-repo:/repos/demo-repo:ro
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgres
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: ${DB_PASSWORD:-semaphore_pw}
      SEMAPHORE_DB: semaphore
      # --- compte admin cree au premier demarrage ---
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@example.com
    depends_on:
      postgres:
        condition: service_healthy   # attend le healthcheck de la base

volumes:
  semaphore_db:
